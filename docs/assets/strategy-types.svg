<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" role="img" aria-label="The four strategy types: scheduled buys and limit orders on the public tier, grid and balancer on the beta tier.">
  <defs>
    <style>
      .t      { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .box    { fill: #f4f6fa; stroke: #b9c4d6; stroke-width: 1.5; }
      .name   { font-size: 16px; font-weight: 600; fill: #16202e; }
      .sub    { font-size: 12px; fill: #5a6a80; }
      .tag    { font-size: 10.5px; font-weight: 600; }
      .pubbg  { fill: #dff0e4; stroke: #7fae90; stroke-width: 1; }
      .betabg { fill: #fdeedd; stroke: #d9a367; stroke-width: 1; }
      .pubtx  { fill: #3f6b4f; }
      .betatx { fill: #8a5b1e; }
      .note   { font-size: 12px; fill: #5a6a80; }
    </style>
  </defs>

  <rect class="box" x="30"  y="40"  width="330" height="140" rx="8"/>
  <rect class="pubbg" x="52" y="60" width="52" height="19" rx="9"/>
  <text class="t tag pubtx" x="78" y="74" text-anchor="middle">PUBLIC</text>
  <text class="t name" x="52" y="105">Scheduled buys</text>
  <text class="t sub"  x="52" y="128">Trade a fixed amount on a fixed</text>
  <text class="t sub"  x="52" y="146">interval. Averages in over time,</text>
  <text class="t sub"  x="52" y="164">whether or not you are watching.</text>

  <rect class="box" x="380" y="40"  width="330" height="140" rx="8"/>
  <rect class="pubbg" x="402" y="60" width="52" height="19" rx="9"/>
  <text class="t tag pubtx" x="428" y="74" text-anchor="middle">PUBLIC</text>
  <text class="t name" x="402" y="105">Limit orders</text>
  <text class="t sub"  x="402" y="128">Trade only at or better than a price</text>
  <text class="t sub"  x="402" y="146">you set. If the market never gets</text>
  <text class="t sub"  x="402" y="164">there, nothing happens.</text>

  <rect class="box" x="30"  y="200" width="330" height="140" rx="8"/>
  <rect class="betabg" x="52" y="220" width="44" height="19" rx="9"/>
  <text class="t tag betatx" x="74" y="234" text-anchor="middle">BETA</text>
  <text class="t name" x="52" y="265">Grid</text>
  <text class="t sub"  x="52" y="288">Price cells that buy low, sell high</text>
  <text class="t sub"  x="52" y="306">and re-arm themselves. Earns from</text>
  <text class="t sub"  x="52" y="324">a range; suffers in a trend.</text>

  <rect class="box" x="380" y="200" width="330" height="140" rx="8"/>
  <rect class="betabg" x="402" y="220" width="44" height="19" rx="9"/>
  <text class="t tag betatx" x="424" y="234" text-anchor="middle">BETA</text>
  <text class="t name" x="402" y="265">Balancer</text>
  <text class="t sub"  x="402" y="288">Hold several assets at target values</text>
  <text class="t sub"  x="402" y="306">and trade back when one drifts.</text>
  <text class="t sub"  x="402" y="324">Sells strength, buys weakness.</text>

  <text class="t note" x="370" y="376" text-anchor="middle">Every type carries a price bound the contract enforces on chain. None can be created without one.</text>
</svg>
