<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="DeFi Passport architecture. Your passport is the only component that holds your funds. Your wallet owns it, it trades through HOGSWAP onto Algorand DEXs, the keeper can only trigger rules, and the registry and directory are read by the passport.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7188a5"/>
    </marker>
    <marker id="arrowmuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa9bd"/>
    </marker>
    <style>
      .t      { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .box    { fill: #f4f6fa; stroke: #b9c4d6; stroke-width: 1.5; }
      .untrust{ fill: #f4f6fa; stroke: #b9c4d6; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .key    { fill: #e3edff; stroke: #6f97dd; stroke-width: 2; }
      .zone   { fill: #6f97dd; fill-opacity: 0.07; stroke: #6f97dd; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .title  { font-size: 15px; font-weight: 600; fill: #16202e; }
      .sub    { font-size: 11.5px; fill: #5a6a80; }
      .lbl    { font-size: 11px; fill: #5a6a80; }
      .zonelbl{ font-size: 11.5px; font-weight: 600; fill: #3f6099; }
      .line   { stroke: #7188a5; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .dash   { stroke: #9aa9bd; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrowmuted); }
      .foot   { font-size: 12px; fill: #5a6a80; }
    </style>
  </defs>

  <rect class="zone" x="262" y="14" width="248" height="132" rx="12"/>
  <text class="t zonelbl" x="386" y="136" text-anchor="middle">your funds live here, and nowhere else</text>

  <rect class="key" x="288" y="30" width="196" height="80" rx="8"/>
  <text class="t title" x="386" y="57" text-anchor="middle">Your passport</text>
  <text class="t sub" x="386" y="76" text-anchor="middle">holds your funds</text>
  <text class="t sub" x="386" y="93" text-anchor="middle">enforces your rules</text>

  <rect class="box" x="25" y="44" width="160" height="60" rx="8"/>
  <text class="t title" x="105" y="69" text-anchor="middle">Your wallet</text>
  <text class="t sub" x="105" y="88" text-anchor="middle">signs everything</text>

  <rect class="box" x="570" y="44" width="160" height="60" rx="8"/>
  <text class="t title" x="650" y="69" text-anchor="middle">HOGSWAP</text>
  <text class="t sub" x="650" y="88" text-anchor="middle">finds the route</text>

  <rect class="box" x="570" y="186" width="160" height="60" rx="8"/>
  <text class="t title" x="650" y="211" text-anchor="middle">Algorand DEXs</text>
  <text class="t sub" x="650" y="230" text-anchor="middle">where trades land</text>

  <rect class="untrust" x="25" y="186" width="160" height="60" rx="8"/>
  <text class="t title" x="105" y="211" text-anchor="middle">Keeper</text>
  <text class="t sub" x="105" y="230" text-anchor="middle">off-chain, untrusted</text>

  <rect class="box" x="244" y="308" width="136" height="60" rx="8"/>
  <text class="t title" x="312" y="333" text-anchor="middle">Registry</text>
  <text class="t sub" x="312" y="352" text-anchor="middle">fee rate, keeper id</text>

  <rect class="box" x="400" y="308" width="136" height="60" rx="8"/>
  <text class="t title" x="468" y="333" text-anchor="middle">Directory</text>
  <text class="t sub" x="468" y="352" text-anchor="middle">current addresses</text>

  <path class="line" d="M 187 74 L 284 70"/>
  <text class="t lbl" x="234" y="63" text-anchor="middle">owns</text>

  <path class="line" d="M 486 70 L 566 74"/>
  <text class="t lbl" x="526" y="63" text-anchor="middle">trades via</text>

  <path class="line" d="M 650 106 L 650 182"/>

  <path class="line" d="M 187 200 L 302 116"/>
  <text class="t lbl" x="232" y="158" text-anchor="middle">triggers a rule</text>

  <path class="dash" d="M 320 304 L 352 152"/>
  <path class="dash" d="M 460 304 L 424 152"/>
  <text class="t lbl" x="386" y="290" text-anchor="middle">read by your passport</text>

  <text class="t foot" x="380" y="400" text-anchor="middle">Everything outside the boundary holds none of your funds. The keeper can trigger a rule you wrote, and nothing else.</text>
</svg>
