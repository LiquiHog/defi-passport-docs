<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 290" width="740" height="290" role="img" aria-label="A passport's balance splits into free balance, which is withdrawable, plus funds reserved by rules and holdings you have set aside, which are not.">
  <defs>
    <style>
      .t     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h     { font-size: 15px; font-weight: 600; fill: #16202e; }
      .seg   { font-size: 14px; font-weight: 600; fill: #16202e; }
      .sub   { font-size: 11.5px; fill: #5a6a80; }
      .note  { font-size: 12px; fill: #5a6a80; }
      .free  { fill: #dff0e4; stroke: #7fae90; stroke-width: 1.5; }
      .resv  { fill: #e3edff; stroke: #6f97dd; stroke-width: 1.5; }
      .aside { fill: #fdeedd; stroke: #d9a367; stroke-width: 1.5; }
      .brk   { stroke: #7fae90; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <text class="t h" x="30" y="36">What your passport holds</text>

  <rect class="free"  x="30"  y="58" width="260" height="70" rx="6"/>
  <rect class="resv"  x="290" y="58" width="230" height="70"/>
  <rect class="aside" x="520" y="58" width="190" height="70" rx="6"/>

  <text class="t seg" x="160" y="99" text-anchor="middle">Free</text>
  <text class="t seg" x="405" y="99" text-anchor="middle">Reserved</text>
  <text class="t seg" x="615" y="99" text-anchor="middle">Set aside</text>

  <text class="t sub" x="160" y="153" text-anchor="middle">Not spoken for.</text>
  <text class="t sub" x="160" y="170" text-anchor="middle">Withdraw it, spend it,</text>
  <text class="t sub" x="160" y="187" text-anchor="middle">or commit it to a rule.</text>

  <text class="t sub" x="405" y="153" text-anchor="middle">Held by a rule or a</text>
  <text class="t sub" x="405" y="170" text-anchor="middle">strategy reserve. Released</text>
  <text class="t sub" x="405" y="187" text-anchor="middle">when you cancel it.</text>

  <text class="t sub" x="615" y="153" text-anchor="middle">Your gas reserve, and</text>
  <text class="t sub" x="615" y="170" text-anchor="middle">HOG you protected from</text>
  <text class="t sub" x="615" y="187" text-anchor="middle">accidental spending.</text>

  <path class="brk" d="M 30 216 L 30 224 L 290 224 L 290 216"/>
  <text class="t sub" x="160" y="244" text-anchor="middle" font-weight="600" fill="#4a7a5c">withdrawable</text>

  <text class="t note" x="370" y="278" text-anchor="middle">Nothing here is stuck. Cancel a rule or release a holding and it returns to free balance immediately.</text>
</svg>
